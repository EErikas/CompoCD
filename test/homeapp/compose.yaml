services:
  opa:
    image: ghcr.io/eerikas/iventoy:latest
    restart: unless-stopped
    privileged: true
    environment:
      - AUTOSTART=true
    ports:
      - 26000:26000
      - 16000:16000
      - 10809:10809
      - 69:69/udp
    volumes:
      - ./:/iventoy/iso
      - ./:/iventoy/data
      - ./:/iventoy/log
      - ./:/iventoy/user
